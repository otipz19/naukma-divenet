decisions:
  - add-object-storage design.md D1-D6 (divenet.media.storage local|minio, local by default; private bucket; re-readable resource keeps ranges; compose rules know minio; old media-data needs ADR-0012's copy command)
  - add-video-media design.md D1-D8 (stored as uploaded, no ffmpeg; separate endpoint and join tables; attach refuses the wrong kind; images keep their own 10 MB check; up to 50 MB held in the heap until add-object-storage)
  - add-achievements design.md D1-D6 (rules read live data; awards permanent; after-commit listener in the request thread; progress follows showStatistics; banner compares before and after)
  - add-feeds design.md D1-D6 (one list endpoint with optional filters; fixed newest-first order; unknown filter values give an empty page; filters and page in the URL)
  - add-posts design.md D1-D6 (plain text with images after it; a draft answers 404 to all but its author; a site's post takes its region; published_at survives moving to drafts; PostPublished left to add-achievements)
  - add-dive-log design.md D1-D6 + notes (hidden sections answer 403; buddies and notes owner-only; approved sites only; one day of grace past UTC; DiveLogged left to add-achievements)
  - add-site-reviews design.md D1-D8 + impl: MediaService.attach/release clear the persistence context (reload after); enum params bind case-insensitively (EnumParameterConfig); reviews list takes page/size, not Pageable (ARCHITECTURE.md); API on 8081 locally when 8080 is busy (DIVENET_API_URL)
  - Plan changes for other roadmap items go in docs/plan-updates/<target>/<source>--<slug>.md notes, never edits of their rows (docs/adr/0010, AGENTS.md workflow rules)
  - Stack and conventions: docs/adr/0001, 0003-0006; layered monolith with ArchUnit layer rules: docs/adr/0008
  - No required human review; master protected (PR + green check and stack jobs); repo allows auto-merge
  - Workflow: propose -> apply -> sync (if delta specs) -> archive -> PR, all on one branch (AGENTS.md "Workflow rules")
  - UI design lives in design/ (repo is the source); claude.ai design system + canvas are mirrors: docs/DESIGN.md, docs/adr/0009
