name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Builds and starts compose.yaml, checks it over HTTP and tears it down (spec shared/local-stack).
  # Needs only Node and Docker on the runner; both builds run inside Docker.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No dependencies to cache; the default would look for pnpm (packageManager), which this job does not install.
          package-manager-cache: false
      - run: node scripts/smoke-stack.mjs

  # Runs the Playwright E2E journeys against the real compose stack (spec shared/e2e,
  # change add-e2e-suite). Not part of `pnpm check`: it needs Docker and minutes, like `stack`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Chromium pinned by the lockfile: its cache key is the same hash, so a bumped
      # @playwright/test re-downloads its matching browser build.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: node scripts/run-e2e.mjs

  # Runs the k6 load scenarios and the Lighthouse budget against the real compose stack
  # (spec shared/performance). Not part of `pnpm check`: it needs Docker and minutes, like `stack`
  # and `e2e`. k6 itself is the pinned image the runner starts on the stack's network.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No pnpm here: the runner needs only Node and perf/'s own lockfile.
          package-manager-cache: false
      - run: npm --prefix perf ci
      # A browser for Lighthouse; on Linux the E2E suite's Chromium cache is a known path.
      - run: npx --yes playwright@1.65.0 install chromium --with-deps
      - run: node scripts/run-perf.mjs 2>&1 | tee performance-report.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: |
            performance-report.txt
          if-no-files-found: ignore
