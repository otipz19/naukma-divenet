name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # M0 (`add-local-stack`) adds actions/setup-java (Temurin 25) here for the backend step.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
