name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: pnpm install --frozen-lockfile
      # Spec shared/security "audited production dependencies": fails fast, before
      # the minutes-long gate, when a shipped package carries a high advisory.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check

  # Builds and starts compose.yaml, checks it over HTTP and tears it down (spec shared/local-stack).
  # Needs only Node and Docker on the runner; both builds run inside Docker.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No dependencies to cache; the default would look for pnpm (packageManager), which this job does not install.
          package-manager-cache: false
      - run: node scripts/smoke-stack.mjs

  # Runs the Playwright E2E journeys against the real compose stack (spec shared/e2e,
  # change add-e2e-suite). Not part of `pnpm check`: it needs Docker and minutes, like `stack`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Chromium pinned by the lockfile: its cache key is the same hash, so a bumped
      # @playwright/test re-downloads its matching browser build.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: node scripts/run-e2e.mjs

  # Runs the k6 load scenarios and the Lighthouse budget against the real compose stack
  # (spec shared/performance). Not part of `pnpm check`: it needs Docker and minutes, like `stack`
  # and `e2e`. k6 itself is the pinned image the runner starts on the stack's network.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No pnpm here: the runner needs only Node and perf/'s own lockfile.
          package-manager-cache: false
      - run: npm --prefix perf ci
      # A browser for Lighthouse: Google Chrome stable. The Playwright Chromium the
      # E2E suite uses hangs under chrome-launcher on this runner image.
      - run: wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      - run: sudo apt-get install -y /tmp/chrome.deb
      - run: echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - run: node scripts/run-perf.mjs 2>&1 | tee performance-report.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: |
            performance-report.txt
          if-no-files-found: ignore
  # Scans the two built images with Trivy (spec shared/security). One pass covers
  # the image OS layers and the applications inside: the backend image carries the
  # Spring Boot jar, so its Java dependencies are checked through Trivy's Java DB
  # and no separate Maven CVE tool is needed. --ignore-unfixed keeps the gate to
  # findings with an available fix. Not part of `pnpm check`: it needs Docker.
  # The 30m scan budget: DB downloads and analysis share it, and the backend image
  # (JDK + fat jar) needs minutes even on fast disks.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t divenet-backend -f backend/Dockerfile backend/
      - run: docker build -t divenet-web -f frontend/Dockerfile .
      # --timeout 30m: the default 5-minute budget covers the DB downloads too, and
      # the backend image (JDK + fat jar) needs more than a fast machine's default.
      # --security-checks vuln skips secret scanning. The shared trivy-cache volume
      # lets the second scan reuse the databases instead of downloading them again.
      - run: docker volume create trivy-cache
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.36.1 image --security-checks vuln --severity HIGH,CRITICAL --ignore-unfixed --timeout 30m --exit-code 1 divenet-backend
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.36.1 image --security-checks vuln --severity HIGH,CRITICAL --ignore-unfixed --timeout 30m --exit-code 1 divenet-web
