spring:
  application:
    name: divenet
  datasource:
    # Local development defaults; real values come from the environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divenet}
    username: ${DB_USERNAME:divenet}
    password: ${DB_PASSWORD:divenet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Keep the anonymous body to {"status": ...}; probe groups can be enabled by add-local-stack.
      probes:
        enabled: false

springdoc:
  paths-to-match: /api/v1/**
