spring:
  application:
    name: divenet
  datasource:
    # Local development defaults; real values come from the environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divenet}
    username: ${DB_USERNAME:divenet}
    password: ${DB_PASSWORD:divenet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # One image of up to 10 MB per upload (spec media/uploads); the request adds multipart framing.
      max-file-size: 50MB
      max-request-size: 51MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto

server:
  tomcat:
    # Read the rest of a too-large upload, so the client gets the 413 body, not a reset connection.
    max-swallow-size: 12MB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Keep the anonymous body to {"status": ...}; probe groups can be enabled by add-local-stack.
      probes:
        enabled: false

divenet:
  auth:
    # Local development and test default only; compose requires JWT_SECRET (design D8).
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
    admin:
      # Both set: the first admin is created at startup. Either unset or blank: no admin.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:Admin}
  media:
    # local (the default) or minio (ADR-0012); compose sets minio.
    storage: ${MEDIA_STORAGE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:divenet-media}
    # Uploaded files (ADR-0006); compose mounts a named volume here (design D8).
    dir: ${MEDIA_DIR:media-data}
    cleanup-interval: PT1H

springdoc:
  paths-to-match: /api/v1/**
