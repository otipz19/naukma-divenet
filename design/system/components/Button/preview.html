<!-- @dsCard group="Actions" height=150 subtitle="Primary / secondary / ghost / danger, two sizes" -->
<div style="display: grid; gap: 16px; padding: 24px; background: var(--surface-0)">
  <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
    <button class="dn-btn dn-btn--primary">Write a review</button>
    <button class="dn-btn dn-btn--secondary">Cancel</button>
    <button class="dn-btn dn-btn--ghost">Edit</button>
    <button class="dn-btn dn-btn--danger">Delete review</button>
    <button class="dn-btn dn-btn--primary" disabled>Saving…</button>
  </div>
  <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
    <button class="dn-btn dn-btn--primary dn-btn--sm">Approve</button>
    <button class="dn-btn dn-btn--secondary dn-btn--sm">Reject</button>
    <button class="dn-btn dn-btn--ghost dn-btn--sm">Show more</button>
  </div>
</div>
