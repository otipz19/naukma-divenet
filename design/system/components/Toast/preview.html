<!-- @dsCard group="Status" height=240 subtitle="Two stacked achievement toasts" -->
<div style="display: grid; justify-items: end; padding: 24px; background: var(--surface-0)">
  <div class="dn-toasts" role="status" style="position: static">
    <div class="dn-toast">
      <svg class="dn-toast__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
      <div class="dn-toast__body"><strong class="dn-toast__title">Achievement unlocked: First dive</strong><span>You logged your first dive.</span><a href="#">See achievements</a></div>
      <button class="dn-toast__close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
    </div>
    <div class="dn-toast">
      <svg class="dn-toast__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
      <div class="dn-toast__body"><strong class="dn-toast__title">Achievement unlocked: Wreck Explorer</strong><span>You have logged dives on 3 wrecks.</span><a href="#">See achievements</a></div>
      <button class="dn-toast__close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
    </div>
  </div>
</div>
