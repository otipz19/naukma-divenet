<div style="display: grid; gap: 14px; padding: 24px; background: var(--surface-1)">
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <span class="dn-badge">Red Sea</span>
    <span class="dn-badge dn-badge--accent">Wreck</span>
    <span class="dn-badge dn-badge--success">Verified</span>
    <span class="dn-badge dn-badge--caution">Pending review</span>
    <span class="dn-badge dn-badge--danger">Rejected</span>
    <span class="dn-badge dn-badge--info">Draft</span>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <span class="dn-badge dn-badge--success">Beginner</span>
    <span class="dn-badge dn-badge--info">Intermediate</span>
    <span class="dn-badge dn-badge--caution">Advanced</span>
    <span class="dn-badge dn-badge--danger">Technical</span>
  </div>
</div>
