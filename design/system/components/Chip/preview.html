<!-- @dsCard group="Forms" height=110 subtitle="Pressed and not pressed" -->
<div style="padding: 24px; background: var(--surface-1)">
  <fieldset style="border: 0; margin: 0; padding: 0; display: grid; gap: 8px">
    <legend class="dn-field__label" style="padding: 0; margin-bottom: 8px">Difficulty</legend>
    <div class="dn-chips">
      <button class="dn-chip" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Beginner</button>
      <button class="dn-chip" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>Intermediate</button>
      <button class="dn-chip" aria-pressed="false">Advanced</button>
      <button class="dn-chip" aria-pressed="false">Technical</button>
    </div>
  </fieldset>
</div>
