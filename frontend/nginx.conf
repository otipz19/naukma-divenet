# nginx for the web service in compose.yaml: serves the SPA build and proxies
# /api/ and /media/ to the back-end with the path unchanged.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Upload limit from ADR-0006.
    client_max_body_size 10m;

    # Resolve the back-end through Docker's DNS on each request, so nginx starts
    # without it and follows it when the container is recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes get the app; no-cache so a new build shows on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
