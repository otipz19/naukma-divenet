# nginx for the web service in compose.yaml: serves the SPA build and proxies
# /api/ and /media/ to the back-end with the path unchanged. The upstream pool
# keeps connections to the back-end (spec shared/local-stack "proxies the API"):
# connect-per-request exhausted the ephemeral ports under ~860 req/s.
upstream backend {
    server backend:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Upload limit from ADR-0011: a 50 MB video plus its multipart framing. Images check their own 10 MB.
    client_max_body_size 51m;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes get the app; no-cache so a new build shows on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
